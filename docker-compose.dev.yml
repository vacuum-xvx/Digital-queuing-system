# Development override for live HMR and source bind mounts
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    command: ["npm", "run", "dev"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
