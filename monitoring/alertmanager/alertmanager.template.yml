global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'telegram-notifications'

receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: '__TELEGRAM_BOT_TOKEN__'
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: 'HTML'
        message: |-
          {{ if eq .Status "firing" }}🚨 <b>[АЛЕРТ] {{ .CommonAnnotations.summary }}</b>{{ else }}✅ <b>[РЕШЕНО] {{ .CommonAnnotations.summary }}</b>{{ end }}
          <b>Уровень:</b> <code>{{ .CommonLabels.severity }}</code>
          <b>Описание:</b> {{ .CommonAnnotations.description }}
          {{ if eq .Status "firing" }}<b>Время:</b> {{ ((index .Alerts 0).StartsAt.Local).Format "15:04:05 02.01.2006 (MST)" }}
          {{ else }}<b>Время начала:</b> {{ ((index .Alerts 0).StartsAt.Local).Format "15:04:05 02.01.2006 (MST)" }}
          <b>Время решения:</b> {{ ((index .Alerts 0).EndsAt.Local).Format "15:04:05 02.01.2006 (MST)" }}
          {{ end }}
