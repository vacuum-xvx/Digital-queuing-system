# Production low-memory profile for small VPS (1-2 GB RAM)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # Swagger is disabled in production
  swagger:
    profiles: ["dev"]

  postgres:
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  backend:
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes: []
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:80"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  prometheus:
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  postgres-exporter:
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  alertmanager:
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  loki:
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  promtail:
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  grafana:
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  postgres-backup:
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
