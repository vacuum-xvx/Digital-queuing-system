<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Электронная очередь отделения Почты России — получите талон онлайн или на терминале" />
    <title>Почта России • Электронная очередь</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Golos Text — современный российский шрифт, близкий к фирменной гарнитуре Почты России -->
    <!-- PT Sans — кириллический компромисс (Google Fonts), если Golos недоступен -->
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        /* Дизайн-токены: смена палитры — в одном месте */
        --color-primary:    #003B73;   /* Classic Postal Navy */
        --color-accent:     #0EA5E9;   /* sky-500, бирюзовый */
        --color-accent-2:   #054FA6;   /* Digital Blue */
        --color-bg:         #F8FAFC;
        --color-surface:    #FFFFFF;
        --color-text:       #0F172A;
        --color-text-muted: #64748B;
        /* Шрифт: Golos Text (основной), PT Sans (резерв), системный */
        --font-primary: 'Golos Text', 'PT Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body { font-family: var(--font-primary); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
