---
- name: Подготовка worker-ноды и присоединение к k3s кластеру
  hosts: k3s_workers
  become: true

  vars:
    k3s_server_url: "{{ lookup('env', 'K3S_SERVER_URL') }}"
    k3s_node_token: "{{ lookup('env', 'K3S_NODE_TOKEN') }}"

  pre_tasks:
    - name: Проверить параметры подключения к кластеру
      ansible.builtin.assert:
        that:
          - k3s_server_url | length > 0
          - k3s_node_token | length > 0
        fail_msg: "Перед запуском задайте K3S_SERVER_URL и K3S_NODE_TOKEN"

  tasks:
    - name: Создать swap-файл на 2ГБ для защиты от OOM
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Настроить права на swap-файл
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: '0600'

    - name: Активировать swap
      ansible.builtin.command: "{{ item }}"
      loop:
        - mkswap /swapfile
        - swapon /swapfile
      ignore_errors: true

    - name: Установить k3s-agent и присоединиться к мастеру
      ansible.builtin.shell: "curl -sfL https://get.k3s.io | K3S_URL={{ k3s_server_url }} K3S_TOKEN={{ k3s_node_token }} sh -"
      args:
        creates: /usr/local/bin/k3s-agent
