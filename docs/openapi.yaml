openapi: 3.0.3
info:
  title: E-SUO Queue Engine API
  version: 1.0.0
  description: Backend API for the Queue System (Sprint #1)
servers:
  - url: /api/v1
paths:
  /branches:
    get:
      summary: List branches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'
  /branches/{branchId}/services:
    get:
      summary: List services available in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
  /branches/{branchId}/tickets/qr:
    post:
      summary: Create a QR ticket
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQRTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '200':
          description: OK (Replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Missing header or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tickets/{ticketId}:
    get:
      summary: Get ticket details
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/branches/{branchId}/windows:
    get:
      summary: List operator windows in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Window'
  /operator/windows/{windowId}/current-ticket:
    get:
      summary: Get the current active ticket for a window
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          description: No Content
        '404':
          description: Window Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/windows/{windowId}/call-next:
    post:
      summary: Call the next waiting ticket
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Window Busy or No Eligible Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/tickets/{ticketId}/start:
    post:
      summary: Start service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/tickets/{ticketId}/complete:
    post:
      summary: Complete service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /branches/{branchId}/tickets/live:
    post:
      summary: Create a live queue ticket
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /branches/{branchId}/tickets/appointment:
    post:
      summary: Create an appointment ticket
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/branches/{branchId}/queue-policy:
    get:
      summary: Get queue policy
      operationId: getQueuePolicy
      tags:
        - Admin
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePolicy'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update queue policy
      operationId: updateQueuePolicy
      tags:
        - Admin
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueuePolicyRequest'
      responses:
        '200':
          description: Queue Policy Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PolicyVersionConflict'
  /admin/tickets/{ticketId}/events:
    get:
      summary: List ticket events
      operationId: listTicketEvents
      tags:
        - Admin
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketEvent'
        '404':
          $ref: '#/components/responses/NotFound'
  /appointments:
    post:
      summary: Create an appointment
      operationId: createAppointment
      tags:
        - Client
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchId
                - serviceId
                - scheduledAt
              properties:
                branchId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Appointment Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '200':
          description: Appointment Replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /appointments/{ticketId}/cancel:
    post:
      summary: Cancel an appointment
      operationId: cancelAppointment
      tags:
        - Client
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /operator/windows/{windowId}/status:
    post:
      summary: Change window status
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeWindowStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Window'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/tickets/{ticketId}/return:
    post:
      summary: Return ticket to queue
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operator/tickets/{ticketId}/redirect:
    post:
      summary: Redirect ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedirectTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Idempotency Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: Invalid State
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PolicyVersionConflict:
      description: Policy version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: POLICY_VERSION_CONFLICT
              message: "Version mismatch"
              requestId: "req-123"
  schemas:
    BranchListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    Branch:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    ServiceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Service:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
    Window:
      type: object
      required:
        - id
        - number
        - status
        - services
      properties:
        id:
          type: string
        number:
          type: integer
        status:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Ticket:
      type: object
      required:
        - id
        - publicNumber
        - branchId
        - serviceId
        - source
        - status
        - window
        - createdAt
        - queueEnteredAt
        - calledAt
        - serviceStartedAt
        - completedAt
      properties:
        id:
          type: string
        publicNumber:
          type: string
        branchId:
          type: string
        serviceId:
          type: string
        source:
          type: string
        status:
          type: string
        window:
          type: object
          nullable: true
          required:
            - id
            - number
          properties:
            id:
              type: string
            number:
              type: integer
        createdAt:
          type: string
          format: date-time
        queueEnteredAt:
          type: string
          format: date-time
        calledAt:
          type: string
          format: date-time
          nullable: true
        serviceStartedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    CreateQRTicketRequest:
      type: object
      required:
        - serviceId
      properties:
        serviceId:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    CreateLiveTicketRequest:
      type: object
      required:
        - serviceId
      properties:
        serviceId:
          type: string
    CreateAppointmentRequest:
      type: object
      required:
        - serviceId
        - scheduledAt
      properties:
        serviceId:
          type: string
        scheduledAt:
          type: string
          format: date-time
    ChangeWindowStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    RedirectTicketRequest:
      type: object
      required:
        - newServiceId
      properties:
        newServiceId:
          type: string
        newWindowId:
          type: string
