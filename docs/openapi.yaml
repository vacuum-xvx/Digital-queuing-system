openapi: 3.0.3
info:
  title: E-SUO Queue Engine API
  version: 1.0.0
  description: Backward-compatible Queue System API (Sprints 1–3)
servers:
  - url: /api/v1
paths:
  /branches:
    get:
      summary: List branches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/services:
    get:
      summary: List services available in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/tickets/qr:
    post:
      summary: Create a QR ticket
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQRTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '200':
          description: OK (Replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Missing header or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tickets/{ticketId}:
    get:
      summary: Get ticket details
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/branches/{branchId}/windows:
    get:
      summary: List operator windows in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Window'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/windows/{windowId}/current-ticket:
    get:
      summary: Get the current active ticket for a window
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          description: No Content
        '404':
          description: Window Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/windows/{windowId}/call-next:
    post:
      summary: Call the next waiting ticket
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Window Busy or No Eligible Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/start:
    post:
      summary: Start service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/complete:
    post:
      summary: Complete service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/tickets/live:
    post:
      summary: Create a LIVE ticket (retained legacy alias)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveTicketRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /branches/{branchId}/tickets/appointment:
    post:
      summary: Create an appointment ticket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/branches/{branchId}/overview:
    get:
      summary: Get admin branch overview
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBranchOverview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/branches/{branchId}/priorities:
    put:
      summary: Save legacy priority rules
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PriorityRule'
      responses:
        '200':
          description: Saved priority rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriorityRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/branches/{branchId}/queue-policy:
    get:
      summary: Get queue policy
      operationId: getQueuePolicy
      tags:
        - Admin
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePolicy'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Update queue policy
      operationId: updateQueuePolicy
      tags:
        - Admin
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueuePolicyRequest'
      responses:
        '200':
          description: Queue Policy Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PolicyVersionConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/tickets/{ticketId}/events:
    get:
      summary: List ticket events
      operationId: listTicketEvents
      tags:
        - Admin
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments:
    post:
      summary: Create an appointment
      operationId: createAppointment
      tags:
        - Client
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branchId
                - serviceId
                - scheduledAt
              properties:
                branchId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Appointment Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '200':
          description: Appointment Replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments/{ticketId}/cancel:
    post:
      summary: Cancel an appointment
      operationId: cancelAppointment
      tags:
        - Client
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/windows/{windowId}/status:
    put:
      summary: Change window status
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeWindowStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Window'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/windows/{windowId}/services:
    put:
      summary: Replace the services a window is allowed to serve
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWindowServicesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Window'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/return:
    post:
      summary: Return ticket to queue
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/redirect:
    post:
      summary: Redirect ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedirectTicketRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/branches/{branchId}/tickets/live:
    post:
      summary: Create LIVE ticket for a physically present client
      operationId: createLiveTicket
      parameters:
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveTicketRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '201':
          description: Created; ticket enters WAITING without a window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments/{ticketId}/arrive:
    post:
      summary: Record appointment arrival without changing SCHEDULED status
      operationId: arriveAppointment
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Arrival recorded or repeated while SCHEDULED; arrivedAt is not exposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/no-show:
    post:
      summary: Mark a CALLED ticket NO_SHOW; repeated NO_SHOW is idempotent
      operationId: markNoShow
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: NO_SHOW; historical window retained, active capacity released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /tickets/{ticketId}/position:
    get:
      summary: Get the Core queue rank snapshot for a deterministic OPEN compatible window
      description: Includes busy OPEN windows as reference. This is a snapshot for the next selection, not
        an ETA or guaranteed number of completed clients.
      operationId: getQueuePosition
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Snapshot; nullable fields when unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: INTERNAL_ERROR (sanitized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: IDEMPOTENCY_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: INVALID_TICKET_STATE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PolicyVersionConflict:
      description: Policy version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: POLICY_VERSION_CONFLICT
              message: "Version mismatch"
              requestId: "req-123"
  schemas:
    QueuePolicy:
      type: object
      additionalProperties: false
      required:
      - branchId
      - appointmentDuePriority
      - qrPriority
      - livePriority
      - antiStarvationThresholdMinutes
      - antiStarvationPointsPerMinute
      - appointmentGraceMinutes
      - appointmentLatePenaltyPerMinute
      - appointmentLatePenaltyMaxPoints
      - version
      - updatedAt
      properties:
        branchId:
          type: string
          format: uuid
        appointmentDuePriority:
          type: integer
          minimum: 0
          maximum: 1000
        qrPriority:
          type: integer
          minimum: 0
          maximum: 1000
        livePriority:
          type: integer
          minimum: 0
          maximum: 1000
        antiStarvationThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 240
        antiStarvationPointsPerMinute:
          type: integer
          minimum: 1
          maximum: 600
        appointmentGraceMinutes:
          type: integer
          minimum: 0
          maximum: 120
        appointmentLatePenaltyPerMinute:
          type: integer
          minimum: 0
          maximum: 600
        appointmentLatePenaltyMaxPoints:
          type: integer
          minimum: 0
          maximum: 1000
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    UpdateQueuePolicyRequest:
      type: object
      additionalProperties: false
      description: Core validates appointmentDuePriority > qrPriority and livePriority; appointmentLatePenaltyMaxPoints
        <= appointmentDuePriority. Omitted new fields preserve the current policy only when expectedVersion
        matches; concurrent changes return POLICY_VERSION_CONFLICT. Explicit null is invalid. Every successful
        PUT increments version once, including unchanged values.
      required:
      - appointmentDuePriority
      - qrPriority
      - expectedVersion
      properties:
        appointmentDuePriority:
          type: integer
          minimum: 0
          maximum: 1000
        qrPriority:
          type: integer
          minimum: 0
          maximum: 1000
        livePriority:
          type: integer
          minimum: 0
          maximum: 1000
        antiStarvationThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 240
        antiStarvationPointsPerMinute:
          type: integer
          minimum: 1
          maximum: 600
        appointmentGraceMinutes:
          type: integer
          minimum: 0
          maximum: 120
        appointmentLatePenaltyPerMinute:
          type: integer
          minimum: 0
          maximum: 600
        appointmentLatePenaltyMaxPoints:
          type: integer
          minimum: 0
          maximum: 1000
        expectedVersion:
          type: integer
          format: int64
    AppointmentResponse:
      type: object
      required:
      - ticket
      - scheduledAt
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        scheduledAt:
          type: string
          format: date-time
    QueuePosition:
      type: object
      additionalProperties: false
      required:
      - ticketId
      - ticketStatus
      - reason
      - position
      - referenceWindow
      - calculatedAt
      - effectivePriority
      - effectiveQueueTime
      properties:
        ticketId:
          type: string
          format: uuid
        ticketStatus:
          type: string
          enum:
          - SCHEDULED
          - WAITING
          - CALLED
          - SERVING
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        reason:
          type: string
          enum:
          - AVAILABLE
          - NOT_ELIGIBLE_YET
          - NO_OPEN_COMPATIBLE_WINDOW
          - NOT_QUEUED
        position:
          type: integer
          minimum: 1
          nullable: true
        referenceWindow:
          type: object
          nullable: true
          required:
          - id
          - number
          properties:
            id:
              type: string
              format: uuid
            number:
              type: integer
        calculatedAt:
          type: string
          format: date-time
        effectivePriority:
          type: integer
          format: int64
          nullable: true
        effectiveQueueTime:
          type: string
          format: date-time
          nullable: true
    TicketEvent:
      type: object
      required:
      - id
      - type
      - fromStatus
      - toStatus
      - windowId
      - policyVersion
      - decisionPriority
      - occurredAt
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - CREATED
          - ARRIVED
          - CALLED
          - SERVICE_STARTED
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        fromStatus:
          $ref: '#/components/schemas/TicketStatus'
